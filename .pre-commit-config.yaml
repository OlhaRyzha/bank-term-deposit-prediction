repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]

      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi, jupyter]

      - id: project-check
        name: Project checks
        entry: make check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

[project]
name = "bank-term-deposit-prediction"
version = "0.1.0"
description = "Machine learning project for predicting bank term deposit subscriptions"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ipykernel>=7.0,<8",
    "jupyterlab>=4.4,<5",
    "matplotlib>=3.10,<4",
    "numpy>=2.3,<3",
    "pandas>=2.3,<4",
    "scikit-learn>=1.7,<2",
    "seaborn>=0.13,<0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pandas-stubs>=2.3,<3",
    "pre-commit>=4.3,<5",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["F811", "F841"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
exclude = [".venv", ".git"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/bank_term_deposit_prediction"]
